<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlogPad — Free CKEditor Alternative</title>
<meta name="description" content="Free, dependency-free CKEditor alternative. Drop into any page with 2 lines of code.">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 16px;
    background: #f5f7fa;
    color: #1f2937;
    line-height: 1.6;
  }
  header {
    text-align: center;
    margin-bottom: 28px;
  }
  h1 {
    font-size: 32px;
    margin: 0 0 6px;
    letter-spacing: -0.02em;
  }
  p.sub {
    color: #6b7280;
    margin: 0 0 20px;
    font-size: 15px;
  }
  .actions {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #1a73e8;
    color: #fff;
    padding: 10px 18px;
    text-decoration: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    transition: background .15s;
  }
  .btn:hover { background: #1558c0; }
  .btn.ghost {
    background: #fff;
    color: #1a73e8;
    border: 1px solid #d1d5db;
  }
  .btn.ghost:hover { background: #f9fafb; border-color: #1a73e8; }
  .note {
    text-align: center;
    font-size: 13px;
    color: #6b7280;
    margin-top: 20px;
  }
  .note code {
    background: #e5e7eb;
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 12px;
  }
</style>
</head>
<body>

  <header>
    <h1>✍️ BlogPad</h1>
    <p class="sub">Free, dependency-free CKEditor alternative</p>
    <div class="actions">
      <a class="btn" href="https://github.com/shamserchand1/blogpad">⭐ GitHub</a>
      <a class="btn ghost" href="https://cdn.jsdelivr.net/gh/shamserchand1/blogpad@4.0.1/blogpad.js">📦 CDN</a>
    </div>
  </header>

  <!-- ★ Editor yahan mount hoga ★ -->
  <textarea id="content" name="content"></textarea>

  <p class="note">
    Try: bold, headings, images, tables, <code>/</code> commands. Everything auto-saves locally.
  </p>

  <script src="blogpad.js"></script>
  <script>
    BlogPad.init('#content', {
      height: 700,
      placeholder: 'Start writing… (try "/" for commands)',
      autosaveKey: 'blogpad-demo-draft'
    });
  </script>

</body>
</html>
